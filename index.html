<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Magnet Deposu — Yeni tasarım prototipi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F7F6F2}
a{color:#121212}a:hover{color:#000000}
button{font:inherit;cursor:pointer}
.mbar{display:none}.cbadge{display:none}
.bgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width: 701px){.bgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (min-width: 1000px){.bgrid{grid-template-columns:repeat(6,minmax(0,1fr))}}
@media (max-width: 999px){.bgrid>article:nth-child(n+5){display:none}}
@media (max-width: 700px){.mbar{display:flex}.ctext{display:none}.cbadge{display:inline}.logo{font-size:26px!important}.cbtn{padding:0 14px!important}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="font-family: Inter, system-ui, sans-serif; color: #121212; background: #F7F6F2; min-height: 100vh">

  <header style="background: #FFFFFF">
    <p style="margin: 0; background: #121212; color: #FFFFFF; text-align: center; font-size: 13px; font-weight: 600; padding: 7px 12px">3.000 TL üzeri siparişlerde <span style="color: #FFE14D">kargo bedava</span></p>
    <div style="max-width: 1280px; margin: 0 auto; padding: 12px 16px 2px; display: flex; justify-content: center">
      <button class="logo" onClick="{{goHome}}" aria-label="Magnet Deposu ana sayfa" style="white-space: nowrap; border: 0; background: none; padding: 0; color: #121212; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em">magnet<span style="background: #FFE14D; padding: 0 6px; border-radius: 6px; margin-left: 2px">deposu</span></button>
    </div>
  </header>
  <div style="position: sticky; top: 0; z-index: 5; background: #FFFFFF; border-bottom: 1px solid #E6E4DD">
    <div class="hrow" style="max-width: 1280px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 8px">
      <button onClick="{{openMenu}}" aria-label="Kategoriler menüsünü aç" aria-expanded="{{menuExpanded}}" style="flex: none; height: 44px; min-width: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid #D6D3CA; background: #FFFFFF; color: #121212; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 14px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
        <span class="ctext">Kategoriler</span>
      </button>
      <form role="search" style="flex: 1 1 auto; min-width: 0; display: flex">
        <label for="p-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ürün ara</label>
        <input id="p-search" type="search" placeholder="Ürün ara" style="flex: 1; min-width: 0; height: 44px; border: 1px solid #D6D3CA; border-radius: 999px; padding: 0 16px; font: inherit; font-size: 15px; background: #F7F6F2">
      </form>
      <button onClick="{{goAcc}}" aria-label="Hesabım" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D6D3CA; background: #FFFFFF; color: #121212; display: flex; align-items: center; justify-content: center">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg>
      </button>
      <button class="cbtn" onClick="{{goCart}}" aria-label="Sepet" style="flex: none; white-space: nowrap; height: 44px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 16px; background: #121212; color: #FFE14D; border: 0; font-weight: 600; font-size: 14px">
        <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 8h14l-1.5 12h-11z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
        <span class="ctext">Sepet · {{cartCount}}</span><span class="cbadge">{{cartCount}}</span>
      </button>
    </div>
  </div>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <div style="position: fixed; inset: 0; z-index: 20; display: flex">
      <nav aria-label="Kategoriler" style="width: min(360px, 86vw); height: 100%; background: #FFFFFF; overflow-y: auto; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 2px; box-shadow: 8px 0 24px rgba(0,0,0,.18)">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px">
          <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">magnet<span style="background: #FFE14D; padding: 0 5px; border-radius: 6px; margin-left: 2px">deposu</span></span>
          <button onClick="{{closeMenu}}" aria-label="Menüyü kapat" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid #D6D3CA; background: #FFFFFF; color: #121212; display: flex; align-items: center; justify-content: center">
            <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
          </button>
        </div>
        <p style="margin: 6px 4px; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #555">Kategoriler</p>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{menuCats}}" as="c" hint-placeholder-count="11">
            <button onClick="{{c.open}}" style="display: flex; align-items: center; gap: 8px; border: 1px solid #E6E4DD; border-radius: 12px; background: #F7F6F2; padding: 6px; min-height: 52px; text-align: left; color: #121212">
              <img src="{{c.img}}" alt="" style="flex: none; width: 30px; height: 40px; object-fit: cover; border-radius: 7px; background: #FFFFFF">
              <span style="min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-weight: 600; font-size: 13px; line-height: 1.2">{{c.name}}</span><span style="font-size: 11px; color: #555">{{c.count}} ürün</span></span>
            </button>
          </sc-for>
        </div>
        <div style="border-top: 1px solid #E6E4DD; margin-top: 10px; padding-top: 10px; display: flex; flex-direction: column; gap: 2px">
          <button onClick="{{goAcc}}" style="border: 0; background: none; text-align: left; min-height: 48px; padding: 0 4px; font-weight: 600; font-size: 15px; color: #121212">Hesabım</button>
          <button onClick="{{goCart}}" style="border: 0; background: none; text-align: left; min-height: 48px; padding: 0 4px; font-weight: 600; font-size: 15px; color: #121212">Sepet</button>
        </div>
      </nav>
      <button onClick="{{closeMenu}}" aria-label="Menüyü kapat" style="flex: 1; border: 0; background: rgba(18,18,18,.5)"></button>
    </div>
  </sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div role="status" style="position: fixed; left: 50%; transform: translateX(-50%); bottom: 88px; z-index: 9; background: #121212; color: #FFFFFF; border-radius: 999px; padding: 10px 10px 10px 20px; display: flex; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.18); max-width: calc(100% - 32px)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFE14D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>
      <span style="white-space: nowrap; margin-left: -4px">{{toastText}}</span>
      <button onClick="{{goCart}}" style="border: 0; background: #FFE14D; color: #121212; border-radius: 999px; height: 36px; padding: 0 14px; font-weight: 700; font-size: 13px">Sepete git</button>
    </div>
  </sc-if>

  <!-- ANA SAYFA -->
  <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
    <main>
      <section aria-label="Kategoriler" style="max-width: 1280px; margin: 0 auto; padding: 16px 0 6px">
        <div ref="{{setRingEl}}" onPointerDown="{{stopRing}}" onTouchStart="{{stopRing}}" onWheel="{{stopRing}}" onMouseEnter="{{pauseRing}}" onMouseLeave="{{playRing}}" style="display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 6px; scrollbar-width: none">
          <sc-for list="{{ring}}" as="c" hint-placeholder-count="8">
            <button onClick="{{c.open}}" style="flex: none; width: 84px; border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; color: #121212; text-align: center">
              <span style="width: 78px; height: 78px; border-radius: 50%; padding: 3px; background: #FFE14D; box-sizing: border-box; display: block">
                <img src="{{c.img}}" alt="" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%; border: 3px solid #FFFFFF; box-sizing: border-box; display: block">
              </span>
              <span style="font-size: 12px; font-weight: 600; line-height: 1.2">{{c.name}}</span>
            </button>
          </sc-for>
        </div>
      </section>
      <section id="kategoriler" style="max-width: 1280px; margin: 0 auto; padding: 16px 16px 44px">
        <h2 style="margin: 0 0 14px; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em">Kategoriler</h2>
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px">
          <sc-for list="{{homeCats}}" as="c" hint-placeholder-count="11">
            <button onClick="{{c.open}}" style="position: relative; display: block; padding: 0; border: 0; background: #fff; border-radius: 22px; overflow: hidden; color: #121212; text-align: left">
              <img src="{{c.img}}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block">
              <span style="position: absolute; left: 8px; right: 8px; bottom: 8px; background: rgba(255,255,255,.94); border-radius: 14px; padding: 9px 12px; display: flex; justify-content: space-between; align-items: center; gap: 6px"><strong style="font-size: 14px; line-height: 1.2">{{c.name}}</strong><span style="font-size: 12px; color: #555">{{c.count}}</span></span>
            </button>
          </sc-for>
        </div>
      </section>

      <section style="max-width: 1280px; margin: 0 auto; padding: 0 16px 44px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px">
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em">Çok satanlar</h2>
        </div>
        <div role="tablist" aria-label="Kategori" style="display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 14px">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
            <button role="tab" aria-selected="{{t.selected}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
        <div class="bgrid" style="display: grid; gap: 14px">
          <sc-for list="{{best}}" as="p" hint-placeholder-count="4">
            <article style="display: flex; flex-direction: column; gap: 8px">
              <button onClick="{{p.open}}" style="display: block; border: 0; background: #fff; border-radius: 22px; padding: 8px"><img src="{{p.img}}" alt="{{p.name}}" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 16px; display: block"></button>
              <button onClick="{{p.open}}" style="border: 0; background: none; padding: 0 4px; text-align: left; color: #121212; font-weight: 500; font-size: 14px; line-height: 1.35">{{p.name}}</button>
              <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 4px; margin-top: auto">
                <strong style="font-size: 18px">{{p.priceText}}</strong>
                <button onClick="{{p.add}}" aria-label="{{p.aria}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: #121212; color: #FFE14D; font-size: 22px">+</button>
              </div>
            </article>
          </sc-for>
        </div>
        <button onClick="{{tabAll}}" style="margin-top: 14px; width: 100%; min-height: 48px; border-radius: 999px; border: 1px solid #D6D3CA; background: #fff; font-weight: 600; font-size: 14px; color: #121212">{{tabAllText}}</button>
      </section>

      <section id="temel" style="max-width: 1280px; margin: 0 auto; padding: 0 16px 44px">
        <div style="background: #121212; color: #F7F6F2; border-radius: 28px; padding: clamp(20px, 4vw, 44px)">
          <p style="margin: 0 0 6px; color: #FFE14D; font-weight: 700; font-size: 13px">Temel malzemeler</p>
          <h2 style="margin: 0 0 18px; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(24px, 4vw, 40px); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08">Magnet yapmak için 4 temel malzeme</h2>
          <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: clamp(8px, 2vw, 16px)">
            <sc-for list="{{parts}}" as="p" hint-placeholder-count="4">
              <button onClick="{{p.open}}" style="border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; color: #F7F6F2; text-align: center">
                <img src="{{p.img}}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 14px; display: block">
                <span style="display: flex; flex-direction: column; gap: 2px"><span style="color: #FFE14D; font-size: 11px; font-weight: 700">{{p.n}}</span><strong style="font-size: clamp(12px, 1.6vw, 16px)">{{p.name}}</strong><span style="font-size: 11px; line-height: 1.3; color: #BDB8AD">{{p.sub}}</span></span>
              </button>
            </sc-for>
          </div>
          <p style="margin: 16px 0 0; font-size: 14px; color: #d6d1c6">Her magnet sayfasında diğer malzemeleri tek tıkla sepete ekleyebilirsiniz.</p>
        </div>
      </section>

      <section style="max-width: 1280px; margin: 0 auto; padding: 0 16px 44px">
        <div style="background: #FFE14D; color: #121212; border-radius: 28px; padding: clamp(22px, 4vw, 48px); display: flex; flex-direction: column; align-items: flex-start; gap: 10px">
          <p style="margin: 0; font-weight: 700; font-size: 13px">Kampanyalı toptan ürünler</p>
          <h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(24px, 4vw, 38px); font-weight: 800; line-height: 1.05; letter-spacing: -0.02em">Paket büyüdükçe adet fiyatı düşer.</h2>
          <p style="margin: 0 0 8px; font-size: 15px; max-width: 460px">500'lü paketlerde %5, 1000'li paketlerde %10 indirim.</p>
          <button onClick="{{goCat1000}}" style="min-height: 50px; padding: 0 22px; border: 0; border-radius: 999px; background: #121212; color: #FFE14D; font-weight: 600; font-size: 15px">Toptan paketleri incele</button>
        </div>
      </section>
      <section style="max-width: 1280px; margin: 0 auto; padding: 0 16px 44px">
        <h2 style="margin: 0 0 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em">Kasnağınıza uygun şeffaf pleksi</h2>
        <p style="margin: 0 0 16px; font-size: 15px; color: #4b524f">Kasnağı alırken aynı şekildeki şeffaf pleksiyi de ekleyin.</p>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 10px">
          <sc-for list="{{pairs}}" as="p" hint-placeholder-count="5">
            <div style="background: #fff; border: 1px solid #E6E4DD; border-radius: 20px; padding: 10px; display: flex; align-items: center; gap: 8px">
              <img src="{{p.kImg}}" alt="{{p.kasnak}}" style="flex: none; width: 60px; height: 80px; object-fit: cover; border-radius: 12px">
              <span aria-hidden="true" style="font-weight: 800">+</span>
              <img src="{{p.mImg}}" alt="{{p.magnet}}" style="flex: none; width: 60px; height: 80px; object-fit: cover; border-radius: 12px">
              <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
                <strong style="font-size: 14px; line-height: 1.25">{{p.kasnak}}</strong>
                <span style="font-size: 13px; color: #4b524f; line-height: 1.25">+ {{p.magnet}}</span>
                <span style="font-size: 15px; font-weight: 800">{{p.total}}</span>
              </span>
              <button onClick="{{p.add}}" aria-label="{{p.aria}}" style="flex: none; width: 44px; height: 44px; border: 0; border-radius: 999px; background: #121212; color: #FFE14D; font-size: 22px">+</button>
            </div>
          </sc-for>
        </div>
      </section>

      <section style="max-width: 1280px; margin: 0 auto; padding: 0 0 40px">
        <h2 style="margin: 0 16px 6px; font-family: 'Bricolage Grotesque', sans-serif; font-size: clamp(26px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em">Yüzey seçenekleri</h2>
        <p style="margin: 0 16px 14px; font-size: 15px; color: #4b524f">Klasik şeffaftan altın çerçeveli ve aynalı pleksiye.</p>
        <div style="display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 4px">
          <sc-for list="{{finishes}}" as="f" hint-placeholder-count="5">
            <button onClick="{{goCat}}" style="flex: none; width: 150px; display: flex; flex-direction: column; padding: 0; background: #fff; border: 1px solid #E6E4DD; border-radius: 18px; overflow: hidden; color: #121212; text-align: left">
              <img src="{{f.img}}" alt="" style="width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block">
              <span style="padding: 9px 11px; display: flex; flex-direction: column"><strong style="font-size: 14px">{{f.name}}</strong><span style="font-size: 12px; color: #555">{{f.note}}</span></span>
            </button>
          </sc-for>
        </div>
      </section>

    </main>
  </sc-if>

  <!-- KATEGORİ -->
  <sc-if value="{{isCat}}" hint-placeholder-val="{{ false }}">
    <main style="max-width: 1280px; margin: 0 auto; padding: 24px 20px 64px; display: flex; flex-direction: column; gap: 20px">
      <nav aria-label="Konum" style="font-size: 14px; color: #555; display: flex; gap: 8px; flex-wrap: wrap">
        <button onClick="{{goHome}}" style="border: 0; background: none; padding: 0; color: #121212; text-decoration: underline; font-size: 14px">Ana sayfa</button><span aria-hidden="true">›</span><span>Magnet</span>
      </nav>
      <div style="display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.02em">Magnet</h1>
          <p style="margin: 0; color: #555; font-size: 15px">Paket büyüdükçe adet fiyatı düşer.</p>
        </div>
        <div role="group" aria-label="Paket boyutu" style="display: flex; gap: 8px; flex-wrap: wrap">
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
            <button onClick="{{f.pick}}" aria-pressed="{{f.active}}" style="{{f.style}}">{{f.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px">
        <sc-for list="{{catCards}}" as="p" hint-placeholder-count="6">
          <article style="background: #FFFFFF; border: 1px solid #E6E4DD; border-radius: 22px; padding: 10px 10px 14px; display: flex; flex-direction: column; gap: 10px">
            <button onClick="{{p.open}}" style="border: 0; padding: 0; background: none; position: relative; display: block">
              <img src="{{p.img}}" alt="{{p.name}}" style="width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 16px; background: #F7F6F2; display: block">
              <sc-if value="{{p.hasDisc}}" hint-placeholder-val="{{ false }}">
                <span style="position: absolute; top: 10px; left: 10px; background: #121212; color: #FFE14D; border-radius: 999px; padding: 5px 10px; font-size: 12px; font-weight: 700">{{p.discText}}</span>
              </sc-if>
            </button>
            <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 6px; flex: 1">
              <button onClick="{{p.open}}" style="border: 0; padding: 0; background: none; text-align: left; font-weight: 600; font-size: 15px; line-height: 1.35; color: #121212">{{p.title}}</button>
              <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-top: auto">
                <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 22px">{{p.priceText}}</span>
                <sc-if value="{{p.hasReg}}" hint-placeholder-val="{{ false }}"><s style="color: #6b6b6b; font-size: 14px">{{p.regText}}</s></sc-if>
              </div>
              <span style="font-size: 13px; color: #555">Adet başı {{p.unitText}}</span>
            </div>
            <button onClick="{{p.add}}" style="height: 44px; border: 0; border-radius: 999px; background: #121212; color: #FFFFFF; font-weight: 600; font-size: 14px">Sepete ekle</button>
          </article>
        </sc-for>
      </div>
    </main>
  </sc-if>

  <!-- ÜRÜN -->
  <sc-if value="{{isProd}}" hint-placeholder-val="{{ false }}">
    <main style="max-width: 1280px; margin: 0 auto; padding: 24px 20px 120px; display: flex; flex-direction: column; gap: 40px">
      <nav aria-label="Konum" style="font-size: 14px; color: #555; display: flex; gap: 8px; flex-wrap: wrap">
        <button onClick="{{goHome}}" style="border: 0; background: none; padding: 0; color: #121212; text-decoration: underline; font-size: 14px">Ana sayfa</button><span aria-hidden="true">›</span>
        <button onClick="{{goCat}}" style="border: 0; background: none; padding: 0; color: #121212; text-decoration: underline; font-size: 14px">Magnet</button><span aria-hidden="true">›</span><span>{{prod.name}}</span>
      </nav>
